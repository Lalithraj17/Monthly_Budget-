<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monthly Budget Split</title>
<style>
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#16263A; --muted:#5C6B7A; --line:#D5DDE3;
  --accent:#0E6B63; --accent-ink:#FFFFFF; --warn:#B3243B; --warn-bg:#FBE9EC;
  --caution:#9A6A00; --track:#DCE3E8; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0F1A24; --surface:#17232F; --ink:#E7EEF3; --muted:#9AABB9; --line:#27384A;
    --accent:#4FC3B5; --accent-ink:#0B1A1F; --warn:#FF7A8E; --warn-bg:#3A1B25;
    --caution:#F2C14E; --track:#25374A; color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}

.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.month h1{font-size:1.15rem;font-weight:650;margin:0}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.2rem}

.summary{display:flex;gap:10px;margin-bottom:14px}
.sum{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.sum small{display:block;color:var(--muted);font-size:.8rem}
.sum b{font-size:1.2rem;font-variant-numeric:tabular-nums}

.alerts{margin-bottom:14px}
.alert{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-weight:600}

.setup{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;margin-bottom:14px}
.setup p{margin:0 0 10px;color:var(--muted)}

.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;min-width:0}
.card.zero{border-color:var(--warn);background:var(--warn-bg)}
.card h3{font-size:.95rem;margin:0 0 2px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.left{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:0}
.left.zero{color:var(--warn)}
.left.low{color:var(--caution)}
.sub{font-size:.8rem;color:var(--muted);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.card.zero .sub{color:var(--warn)}
.mini{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.mini i{display:block;height:100%;border-radius:4px;background:var(--accent);max-width:100%}
.card.zero .mini i{background:var(--warn)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.panel h2{font-size:1rem;margin:0 0 12px;font-weight:650}
.row{display:flex;gap:10px}
.row>*{min-width:0}
.field{display:flex;flex-direction:column;gap:4px;flex:1}
.field label{font-size:.82rem;color:var(--muted)}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);min-height:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:999px;font-size:.9rem;background:var(--bg)}
.chip input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.primary{width:100%;margin-top:12px;min-height:48px;border:none;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:650}
.secondary{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600}
.link{background:none;border:none;padding:8px 0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.err{color:var(--warn);font-size:.88rem;margin:8px 0 0;min-height:1.2em}

.split-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.split-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.split-row .input{width:120px}
.x{width:44px;height:44px;border:none;background:none;color:var(--muted);font-size:1.3rem;border-radius:50%}

.day{font-size:.82rem;color:var(--muted);margin:14px 0 4px}
.item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item-main{flex:1;min-width:0}
.item-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-main small{color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:600}
.empty{color:var(--muted);margin:0}

.toasts{position:fixed;left:0;right:0;bottom:12px;display:flex;flex-direction:column;gap:8px;align-items:center;padding:0 12px;pointer-events:none}
.toast{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:10px;background:var(--warn);color:#fff;border-radius:12px;padding:12px 14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast span{flex:1}
.toast button{border:none;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;min-width:44px;min-height:36px}
</style>
</head>
<body>
<div class="wrap">

  <div class="month">
    <button class="nav" id="prev" aria-label="Previous month">&#8249;</button>
    <h1 id="monthTitle"></h1>
    <button class="nav" id="next" aria-label="Next month">&#8250;</button>
  </div>

  <div class="summary">
    <div class="sum"><small>Monthly total</small><b id="sumTotal"></b></div>
    <div class="sum"><small>Spent</small><b id="sumSpent"></b></div>
    <div class="sum"><small>Left</small><b id="sumLeft"></b></div>
  </div>

  <div class="alerts" id="alerts" aria-live="polite"></div>

  <div class="setup hidden" id="setup">
    <p>Split this month's money between your categories to start tracking.</p>
    <button class="primary" id="setupBtn" style="margin-top:0">Split my budget</button>
  </div>

  <div class="cats" id="cats"></div>

  <button class="link" id="splitBtn">Edit split</button>
  <button class="link hidden" id="notifyBtn">Turn on phone alerts</button>

  <section class="panel hidden" id="splitPanel">
    <h2>Split for this month</h2>
    <div id="splitRows"></div>
    <div class="row" style="margin-top:12px">
      <input class="input" id="newCat" maxlength="20" placeholder="New category">
      <button class="secondary" id="addCat">Add</button>
    </div>
    <div class="row" style="margin-top:12px;align-items:flex-end">
      <div class="field" style="flex:0 0 80px">
        <label for="symbolInput">Currency</label>
        <input class="input" id="symbolInput" maxlength="3">
      </div>
      <button class="secondary" id="copyPrev" style="flex:1">Copy last month's split</button>
    </div>
    <p class="err" id="splitErr" role="alert"></p>
    <button class="primary" id="saveSplit" style="margin-top:0">Save split</button>
  </section>

  <section class="panel">
    <h2>Add expense</h2>
    <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
    <div class="row">
      <div class="field">
        <label for="amountInput">Amount</label>
        <input class="input" id="amountInput" inputmode="decimal" placeholder="0.00">
      </div>
      <div class="field">
        <label for="dateInput">Date</label>
        <input class="input" id="dateInput" type="date">
      </div>
    </div>
    <div class="field" style="margin-top:10px">
      <label for="noteInput">Note</label>
      <input class="input" id="noteInput" maxlength="60" placeholder="e.g. Weekly groceries">
    </div>
    <p class="err" id="err" role="alert"></p>
    <button class="primary" id="addBtn" style="margin-top:0">Add expense</button>
  </section>

  <section class="panel">
    <h2>Expenses</h2>
    <div id="list"></div>
  </section>

</div>
<div class="toasts" id="toasts"></div>

<script>
const KEY = "budget-split-data";
let state = {
  symbol: "$",
  cats: ["Housing","Food","Transport","Bills","Fun","Health","Other"],
  alloc: {},      // { "2026-11": { Food: 400, ... } }
  expenses: []    // { id, date, amount, cat, note }
};
let view = ymOf(new Date());
let selectedCat = null;
const $ = id => document.getElementById(id);

function ymOf(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function dateStr(d){ return ymOf(d) + "-" + String(d.getDate()).padStart(2,"0"); }
function shift(ym,n){ const [y,m] = ym.split("-").map(Number); return ymOf(new Date(y,m-1+n,1)); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function money(n){
  const v = Math.round(n*100)/100;
  return (v < 0 ? "-" : "") + state.symbol + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
}
function num(v){ const n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : NaN; }

async function load(){
  try { if (window.storage){ const r = await window.storage.get(KEY); if (r && r.value){ state = Object.assign(state, JSON.parse(r.value)); return; } } } catch(e){}
  try { const v = localStorage.getItem(KEY); if (v) state = Object.assign(state, JSON.parse(v)); } catch(e){}
}
async function save(){
  try { if (window.storage) await window.storage.set(KEY, JSON.stringify(state)); } catch(e){}
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
}

/* ---------- calculations ---------- */
function spentIn(ym, cat){
  return state.expenses.filter(e => e.date.startsWith(ym) && e.cat === cat).reduce((s,e) => s + e.amount, 0);
}
function remaining(ym, cat){
  const a = state.alloc[ym];
  return (a && a[cat] != null ? a[cat] : 0) - spentIn(ym, cat);
}

/* ---------- notifications ---------- */
function notifyCategory(cat, ym){
  const left = remaining(ym, cat);
  const msg = left < 0
    ? cat + ": over budget by " + money(-left)
    : cat + ": " + money(0) + " left";
  showToast(msg);
  try { if (navigator.vibrate) navigator.vibrate([200,100,200]); } catch(e){}
  try {
    if ("Notification" in window && Notification.permission === "granted"){
      new Notification("Budget alert", { body: msg });
    }
  } catch(e){}
}
function showToast(text){
  const t = document.createElement("div");
  t.className = "toast";
  t.setAttribute("role","alert");
  t.innerHTML = "<span>" + esc(text) + "</span><button aria-label='Dismiss'>OK</button>";
  t.querySelector("button").onclick = () => t.remove();
  $("toasts").appendChild(t);
}
function updateNotifyBtn(){
  const ok = ("Notification" in window) && Notification.permission === "default";
  $("notifyBtn").classList.toggle("hidden", !ok);
}
$("notifyBtn").onclick = async () => {
  try { await Notification.requestPermission(); } catch(e){}
  updateNotifyBtn();
};

/* ---------- render ---------- */
function render(){
  const [y,m] = view.split("-").map(Number);
  $("monthTitle").textContent = new Date(y,m-1,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});

  const alloc = state.alloc[view];
  const hasSplit = !!alloc;
  $("setup").classList.toggle("hidden", hasSplit);

  const monthExp = state.expenses.filter(e => e.date.startsWith(view));
  const spent = monthExp.reduce((s,e) => s + e.amount, 0);
  const total = hasSplit ? Object.values(alloc).reduce((s,v) => s + v, 0) : 0;
  $("sumTotal").textContent = money(total);
  $("sumSpent").textContent = money(spent);
  $("sumLeft").textContent = money(total - spent);

  // category cards + alerts
  let cards = "", alerts = "";
  state.cats.forEach(c => {
    const a = hasSplit && alloc[c] != null ? alloc[c] : 0;
    const s = spentIn(view, c);
    if (!hasSplit && s === 0) return;
    if (hasSplit && a === 0 && s === 0) return;
    const left = a - s;
    const zero = hasSplit && left <= 0;
    const low = hasSplit && !zero && a > 0 && left / a <= 0.2;
    const pct = a > 0 ? Math.min(100, s / a * 100) : (s > 0 ? 100 : 0);
    if (zero) alerts += '<div class="alert">' + esc(c) + ': ' + (left < 0 ? 'over by ' + money(-left) : money(0) + ' left') + '</div>';
    cards += '<div class="card' + (zero ? ' zero' : '') + '"><h3>' + esc(c) + '</h3>' +
      '<p class="left' + (zero ? ' zero' : low ? ' low' : '') + '">' + money(left) + '</p>' +
      '<p class="sub">' + money(s) + ' of ' + money(a) + '</p>' +
      '<div class="mini"><i style="width:' + pct + '%"></i></div></div>';
  });
  $("cats").innerHTML = cards;
  $("alerts").innerHTML = alerts;

  // expense form
  if (!selectedCat || !state.cats.includes(selectedCat)) selectedCat = state.cats[0];
  $("chips").innerHTML = state.cats.map(c =>
    '<label class="chip"><input type="radio" name="cat" value="' + esc(c) + '"' + (c === selectedCat ? " checked" : "") + '><span>' + esc(c) + '</span></label>'
  ).join("");
  if (!$("dateInput").value || !$("dateInput").value.startsWith(view)){
    $("dateInput").value = view === ymOf(new Date()) ? dateStr(new Date()) : view + "-01";
  }

  // list
  const sorted = monthExp.slice().sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  let html = "", last = "";
  sorted.forEach(e => {
    if (e.date !== last){
      last = e.date;
      const [yy,mm,dd] = e.date.split("-").map(Number);
      html += '<div class="day">' + new Date(yy,mm-1,dd).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}) + '</div>';
    }
    html += '<div class="item"><div class="item-main"><b>' + esc(e.note || e.cat) + '</b><small>' + esc(e.cat) + '</small></div>' +
      '<span class="amt">' + money(e.amount) + '</span>' +
      '<button class="x" data-id="' + e.id + '" aria-label="Delete expense">&times;</button></div>';
  });
  $("list").innerHTML = html || '<p class="empty">No expenses this month.</p>';
  updateNotifyBtn();
}

/* ---------- split editor ---------- */
let draft = {};
function openSplit(){
  draft = {};
  const a = state.alloc[view] || {};
  state.cats.forEach(c => draft[c] = a[c] != null ? a[c] : "");
  $("symbolInput").value = state.symbol;
  $("splitErr").textContent = "";
  renderSplitRows();
  $("splitPanel").classList.remove("hidden");
  $("splitPanel").scrollIntoView({behavior:"smooth", block:"start"});
}
function readDraft(){
  document.querySelectorAll("#splitRows input").forEach(i => { draft[i.dataset.cat] = i.value; });
}
function renderSplitRows(){
  $("splitRows").innerHTML = Object.keys(draft).map(c =>
    '<div class="split-row"><span>' + esc(c) + '</span>' +
    '<input class="input" inputmode="decimal" placeholder="0" data-cat="' + esc(c) + '" aria-label="' + esc(c) + ' amount" value="' + esc(draft[c]) + '">' +
    '<button class="x" data-rm="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">&times;</button></div>'
  ).join("");
}
$("splitRows").addEventListener("click", e => {
  const b = e.target.closest("[data-rm]"); if (!b) return;
  const c = b.dataset.rm;
  if (state.expenses.some(x => x.cat === c)){
    $("splitErr").textContent = c + " has expenses. Delete them first to remove this category.";
    return;
  }
  readDraft(); delete draft[c];
  state.cats = state.cats.filter(x => x !== c);
  Object.values(state.alloc).forEach(a => delete a[c]);
  renderSplitRows(); render(); save();
});
$("addCat").onclick = () => {
  const n = $("newCat").value.trim();
  if (!n) return;
  if (state.cats.some(c => c.toLowerCase() === n.toLowerCase())){ $("splitErr").textContent = "That category already exists."; return; }
  readDraft(); state.cats.push(n); draft[n] = "";
  $("newCat").value = ""; $("splitErr").textContent = "";
  renderSplitRows(); render(); save();
};
$("copyPrev").onclick = () => {
  const p = state.alloc[shift(view,-1)];
  if (!p){ $("splitErr").textContent = "Last month has no split to copy."; return; }
  readDraft();
  Object.keys(draft).forEach(c => draft[c] = p[c] != null ? p[c] : "");
  $("splitErr").textContent = "";
  renderSplitRows();
};
$("saveSplit").onclick = async () => {
  readDraft();
  const out = {};
  for (const c of Object.keys(draft)){
    const raw = String(draft[c]).trim();
    if (raw === "") { out[c] = 0; continue; }
    const v = num(raw);
    if (!(v >= 0)){ $("splitErr").textContent = "Enter a number of 0 or more for " + c + "."; return; }
    out[c] = Math.round(v*100)/100;
  }
  state.symbol = $("symbolInput").value.trim() || "$";
  state.alloc[view] = out;
  $("splitPanel").classList.add("hidden");
  render(); await save();
};
$("splitBtn").onclick = openSplit;
$("setupBtn").onclick = openSplit;

/* ---------- expenses ---------- */
async function addExpense(){
  const amount = num($("amountInput").value);
  const date = $("dateInput").value;
  if (!(amount > 0)){ $("err").textContent = "Enter an amount greater than 0."; return; }
  if (!date){ $("err").textContent = "Pick a date."; return; }
  const cat = (document.querySelector('input[name="cat"]:checked') || {}).value;
  if (!cat){ $("err").textContent = "Pick a category."; return; }
  state.expenses.push({ id: Date.now(), date, amount: Math.round(amount*100)/100, cat, note: $("noteInput").value.trim() });
  $("amountInput").value = ""; $("noteInput").value = ""; $("err").textContent = "";
  const ym = date.slice(0,7);
  selectedCat = cat;
  if (ym !== view) view = ym;
  render();
  if (state.alloc[ym] && state.alloc[ym][cat] != null && remaining(ym, cat) <= 0) notifyCategory(cat, ym);
  await save();
  $("amountInput").focus();
}
$("addBtn").onclick = addExpense;
["amountInput","noteInput"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") addExpense(); }));
$("chips").addEventListener("change", e => { if (e.target.name === "cat") selectedCat = e.target.value; });
$("list").addEventListener("click", async e => {
  const b = e.target.closest(".x"); if (!b) return;
  state.expenses = state.expenses.filter(x => x.id !== Number(b.dataset.id));
  render(); await save();
});
$("prev").onclick = () => { view = shift(view,-1); $("dateInput").value = ""; $("splitPanel").classList.add("hidden"); render(); };
$("next").onclick = () => { view = shift(view,1); $("dateInput").value = ""; $("splitPanel").classList.add("hidden"); render(); };

(async function init(){
  await load();
  render();
})();
</script>
</body>
</html>
